<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Narrative Preview</title>
  <link rel="stylesheet" href="html-theme.css">
</head>
<body>
  <main class="slide preview-canvas">
    <section class="preview-cover" data-example="cover">
      <div class="kicker">Product narrative / 01</div>
      <div>
        <h1>Make the complex feel inevitable.</h1>
        <p>A focused story system for one idea, one visual anchor, and a clear next move.</p>
      </div>
      <div class="anchor" aria-hidden="true">
        <div class="anchor-fill"></div>
        <div class="anchor-label">72 / 100</div>
      </div>
      <div class="cover-footer">Signal framework</div>
    </section>
    <div class="preview-side">
      <section class="preview-data" data-example="data">
        <div class="panel-head"><span>Data example</span><span>Momentum</span></div>
        <div class="metric-row"><strong class="metric">2.4x</strong><div class="metric-note">Faster decisions after the story was simplified.</div></div>
        <div class="spark" aria-label="Rising six-period bar chart"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </section>
      <section class="preview-process" data-example="process">
        <div class="panel-head"><span>Process example</span><span>Three acts</span></div>
        <div class="process-line"><b class="active">01</b><i></i><b>02</b><i></i><b>03</b></div>
        <div class="process-labels"><span>Frame</span><span>Reveal</span><span>Move</span></div>
      </section>
    </div>
  </main>
</body>
</html>
