<!doctype html>

<body>

      <span class="primitive-label">Cover example / Set 05</span>

      <div class="data-pop"><strong>4X</strong><div class="blocks" aria-label="Four rising block bars"><i></i><i></i><i></i><i></i></div></div>

    <section class="preview-process" data-example="process">
      <div class="panel-title"><span>Process example / Build</span><b>01-03</b></div>
      <div class="process-pieces"><div class="piece"><b>1</b><strong>Break</strong></div><div class="piece"><b>2</b><strong>Move</strong></div><div class="piece"><b>3</b><strong>Join</strong></div></div>
    </section>
